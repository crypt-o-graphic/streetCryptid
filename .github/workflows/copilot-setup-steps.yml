name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - justfile
      - modules/iroh-location/rust-wasm/**
      - modules/iroh-location/rust/src/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore cached Rust WASM output
        id: rust-wasm-cache
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/iroh-location/web
          # Must stay byte-identical to the `wasm-output-*` key in ci.yml's typecheck job so this
          # workflow and CI share one entry instead of each rebuilding the bindings.
          key: wasm-output-${{ runner.os }}-rust-1.97.0-wasm-pack-0.15.0-binaryen-117-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'third_party/**', 'modules/iroh-location/rust-wasm/Cargo.toml', 'modules/iroh-location/rust-wasm/src/**/*.rs', 'modules/iroh-location/rust/Cargo.toml', 'modules/iroh-location/rust/src/**/*.rs', 'justfile') }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libssl-dev perl pkg-config

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Rust and build tools
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: |
            rust@1.97.0+rustfmt+wasm32-unknown-unknown
            just@1.57.0
            wasm-pack@0.15.0
          fallback: none

      - name: Install Binaryen
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_117/binaryen-version_117-x86_64-linux.tar.gz
          echo "3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212  /tmp/binaryen.tar.gz" |
            sha256sum --check
          tar --extract --gzip --file /tmp/binaryen.tar.gz --directory /tmp
          sudo install --mode 0755 /tmp/binaryen-version_117/bin/wasm-opt /usr/local/bin/wasm-opt

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Generate Expo typed routes
        run: |
          CI=1 bunx expo start --offline >/tmp/expo-start.log 2>&1 &
          expo_pid=$!
          trap 'kill "$expo_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if [[ -f expo-env.d.ts && -f .expo/types/router.d.ts ]]; then
              exit 0
            fi
            if ! kill -0 "$expo_pid" 2>/dev/null; then
              cat /tmp/expo-start.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/expo-start.log
          echo "Expo typed-route generation timed out." >&2
          exit 1

      - name: Build web bindings
        if: steps.rust-wasm-cache.outputs.cache-hit != 'true'
        run: just build-wasm
